services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-openprotege}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-openprotege}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      OPENPROTEGE_AI_ENABLED: ${OPENPROTEGE_AI_ENABLED:-false}
      OPENPROTEGE_AI_PROVIDER: ${OPENPROTEGE_AI_PROVIDER:-openai-compatible}
      OPENPROTEGE_AI_BASE_URL: ${OPENPROTEGE_AI_BASE_URL:-https://api.deepseek.com/v1}
      OPENPROTEGE_AI_API_KEY: ${OPENPROTEGE_AI_API_KEY:-}
      OPENPROTEGE_AI_MODEL: ${OPENPROTEGE_AI_MODEL:-deepseek-chat}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
