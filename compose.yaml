services:
  database:
    image: ${DB_IMAGE:-postgres:17-alpine}
    environment:
      DB_VENDOR: ${DB_VENDOR:-postgres}
      POSTGRES_DB: ${DB_NAME:-openprotege}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-openprotege}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD}}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_CONTAINER_PORT:-5432}"
    volumes:
      - ${DB_VOLUME:-postgres_data}:${DB_DATA_PATH:-/var/lib/postgresql/data}
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${DB_VENDOR}\" = mysql ]; then mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent; else pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"; fi"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_PROFILE: ${APP_PROFILE:-prod}
      DB_VENDOR: ${DB_VENDOR:-postgres}
      DB_HOST: database
      DB_CONTAINER_PORT: ${DB_CONTAINER_PORT:-5432}
      DB_NAME: ${DB_NAME:-openprotege}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      OPENPROTEGE_REASONING_MAX_AXIOMS: ${OPENPROTEGE_REASONING_MAX_AXIOMS:-100000}
      OPENPROTEGE_REASONING_TIMEOUT: ${OPENPROTEGE_REASONING_TIMEOUT:-60s}
      OPENPROTEGE_AI_ENABLED: ${OPENPROTEGE_AI_ENABLED:-false}
      OPENPROTEGE_AI_PROVIDER: ${OPENPROTEGE_AI_PROVIDER:-openai-compatible}
      OPENPROTEGE_AI_BASE_URL: ${OPENPROTEGE_AI_BASE_URL:-https://api.deepseek.com/v1}
      OPENPROTEGE_AI_API_KEY: ${OPENPROTEGE_AI_API_KEY:-}
      OPENPROTEGE_AI_MODEL: ${OPENPROTEGE_AI_MODEL:-deepseek-chat}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
  mysql_data:
