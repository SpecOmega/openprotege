spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${DB_CONTAINER_PORT:3306}}/${DB_NAME:openprotege}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:openprotege}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET SESSION sql_mode = CONCAT(@@SESSION.sql_mode, ',ANSI_QUOTES')"
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration/mysql
