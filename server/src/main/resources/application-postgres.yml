spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${DB_CONTAINER_PORT:5432}}/${DB_NAME:openprotege}}
    username: ${DB_USER:openprotege}
    password: ${DB_PASSWORD:}
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration/postgresql
