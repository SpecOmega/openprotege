spring:
  application:
    name: openprotege-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openprotege}
    username: ${DB_USER:openprotege}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${OPENPROTEGE_ONTOLOGY_MAX_FILE_SIZE:500MB}
      max-request-size: ${OPENPROTEGE_ONTOLOGY_MAX_REQUEST_SIZE:501MB}
openprotege:
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  ontology:
    max-file-size: ${OPENPROTEGE_ONTOLOGY_MAX_FILE_SIZE:500MB}
  ai:
    enabled: ${OPENPROTEGE_AI_ENABLED:false}
    provider: ${OPENPROTEGE_AI_PROVIDER:openai-compatible}
    base-url: ${OPENPROTEGE_AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${OPENPROTEGE_AI_API_KEY:}
    model: ${OPENPROTEGE_AI_MODEL:deepseek-chat}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
        add-additional-paths: true
